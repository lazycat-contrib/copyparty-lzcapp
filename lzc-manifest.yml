application:
  subdomain: copyparty
  multi_instance: false
  upstreams:
    - location: /package-licenses/
      backend: file:///lzcapp/pkg/content/licenses/
    - location: /
      backend: http://copyparty:3923/

services:
  copyparty:
    # upstream: copyparty/ac:1.20.26
    image: docker.1ms.run/copyparty/ac:1.20.26
    environment:
      - |-
        COPYARTY_USER={{ .U.upload_user | replace "\r" "" | replace "\n" "" }}
      - |-
        COPYARTY_PASS={{ .U.upload_secret | replace "\r" "" | replace "\n" "" }}
    command: sh /lzcapp/pkg/content/start.sh
    binds:
      - /lzcapp/var/data:/w

usage: |
  CopyParty 是轻量文件服务器：浏览器里浏览/上传/下载，支持断点续传、缩略图、媒体索引、搜索，也能用 WebDAV 挂载。

  使用方法：
  1. 打开应用，用部署参数里的用户名和密码登录（首次进入会弹出自带的登录框）。
  2. 登录后可新建文件夹、拖拽上传、在线预览图片和音视频。
  3. 需要当网盘用时，用同一地址和账号在 WebDAV 客户端里挂载。

  数据与安全：
  - 共享的文件全部保存在 /lzcapp/var/data，卸载应用会一并删除，请提前备份。
  - 本包强制账号：没有账号的请求拿不到任何文件，/ 卷只授予部署参数里的那个账号读写删除权限，不存在匿名读写。
  - 账号密码在容器启动时校验并渲染到内存临时目录，不写入数据目录、不打包进镜像。
  - 应用经懒猫入口鉴权访问。

  说明：
  - 修改部署参数里的用户名或密码后需要重新部署，容器会按新值重建账号（旧账号随即失效）。
  - 用户名只允许字母、数字和 _ . @ -；密码至少 12 位，支持字母数字和 _ . ~ ! @ # % ^ + = -。
  - 未做真机验证：登录、上传下载、断点续传、缩略图、WebDAV 挂载、以及重启后持久化均未在设备上实测。
